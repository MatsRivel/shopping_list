<!doctype html>
<html lang="nb" data-theme="salvie">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BCD3B8">
<title>Vår liste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palettes. Each maps onto the same set of roles; <html data-theme> picks one (stored per household). */
  [data-theme="salvie"] { --bg:#F1F5EC; --card:#FFFFFF; --block:#BCD3B8; --onblock:#1F3A2E; --onblock-muted:#3A5444; --ink:#1F2A24; --muted:#526459; --edge:#799180; --line:#DCE5D6; --primary:#2F5D46; --onprimary:#FFFFFF; --partner:#F4C9C2; --onpartner:#4A2420; --track:#A4BFA0; --fill:#1F3A2E; }
  [data-theme="mynte"]  { --bg:#EFF8F5; --card:#FFFFFF; --block:#B9E2D5; --onblock:#123B35; --onblock-muted:#2F5A52; --ink:#14302B; --muted:#4D6762; --edge:#6B968A; --line:#D3E8E1; --primary:#1F6F63; --onprimary:#FFFFFF; --partner:#DACDF2; --onpartner:#2E2150; --track:#9ACDBD; --fill:#123B35; }
  [data-theme="oliven"] { --bg:#F6F6E8; --card:#FFFEF8; --block:#D6D9A3; --onblock:#2F3416; --onblock-muted:#4C5226; --ink:#2B2E16; --muted:#5E6240; --edge:#8C8F60; --line:#E4E5C8; --primary:#55602B; --onprimary:#FFFFFF; --partner:#F2D58B; --onpartner:#4A3708; --track:#BCC084; --fill:#2F3416; }
  [data-theme="skog"]   { --bg:#16231C; --card:#1F3027; --block:#24392E; --onblock:#E6F0E4; --onblock-muted:#B7CBBB; --ink:#E6F0E4; --muted:#AFC2B4; --edge:#5F7D6B; --line:#2E4337; --primary:#8FD1AE; --onprimary:#12261C; --partner:#E8BBA9; --onpartner:#3B1D12; --track:#3A5546; --fill:#8FD1AE; }
  :root { color-scheme: light; } [data-theme="skog"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  body { margin:0; font:17px/1.4 'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  button, input { font-family: inherit; }
  [hidden] { display:none !important; }
  :focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
  .block :focus-visible { outline-color:var(--onblock); }
  h1 { margin:0; font:800 34px 'Bricolage Grotesque','DM Sans',sans-serif; letter-spacing:-.8px; }
  h2 { margin:0 0 2px; font-size:14px; font-weight:600; color:var(--muted); }
  svg { flex:none; }

  #shell { max-width:520px; min-height:100dvh; margin:0 auto; display:flex; flex-direction:column; }
  .screen { flex:1; display:flex; flex-direction:column; }
  .view { flex:1; padding:16px 20px; }
  /* the big sage header block with the rounded bottom edge */
  .block { padding:24px 20px 22px; border-radius:0 0 32px 32px; background:var(--block); color:var(--onblock); display:flex; flex-direction:column; gap:14px; }
  .block p { margin:0; font-size:15px; color:var(--onblock-muted); }
  .head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .back { width:48px; height:48px; margin:-8px 0 -8px -12px; display:flex; align-items:center; justify-content:center; border:0; background:none; color:inherit; cursor:pointer; border-radius:24px; }

  .lang { display:flex; padding:3px; border-radius:20px; background:var(--track); }
  .lang button { min-width:44px; height:36px; border:0; border-radius:18px; background:transparent; color:var(--onblock); font-size:13px; font-weight:600; cursor:pointer; }
  .lang button[aria-pressed=true] { background:var(--primary); color:var(--onprimary); }

  .seg { display:flex; padding:3px; border-radius:22px; background:var(--track); }
  .seg button { flex:1; min-height:40px; padding:0 14px; border:0; border-radius:19px; background:transparent; color:var(--onblock); font-size:15px; font-weight:600; cursor:pointer; }
  .seg button[aria-pressed=true] { background:var(--primary); color:var(--onprimary); }
  .view .seg { background:var(--card); border:1.5px solid var(--edge); } .view .seg button { color:var(--ink); } .view .seg button[aria-pressed=true] { color:var(--onprimary); }
  .units { margin:-12px 0 24px auto; width:max-content; } .units button { min-width:64px; min-height:44px; }
  .progress .row { display:flex; justify-content:space-between; gap:8px; font-size:14px; font-weight:500; color:var(--onblock-muted); }
  .bar { height:8px; border-radius:4px; background:var(--track); margin-top:8px; overflow:hidden; }
  .bar div { height:100%; border-radius:4px; background:var(--fill); width:0; transition:width .2s; }

  .addrow { display:flex; align-items:center; gap:12px; width:100%; height:52px; margin:0 0 4px; padding:0 16px; border-radius:26px; background:var(--card); border:1.5px solid var(--edge); color:var(--muted); font-size:16px; cursor:pointer; text-align:left; }

  .btn { height:56px; padding:0 22px; border:0; border-radius:28px; background:var(--primary); color:var(--onprimary); font-size:17px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; }
  .btn.ghost { background:var(--card); color:var(--primary); border:1.5px solid var(--primary); font-size:16px; }
  .btn.wide { width:100%; }

  section.aisle { padding-top:16px; }
  .row-item { display:flex; align-items:center; border-bottom:1px solid var(--line); }
  .toggle { flex:1; min-width:0; display:flex; align-items:center; gap:14px; min-height:58px; padding:6px 0; background:none; border:0; text-align:left; color:inherit; font-size:17px; cursor:pointer; }
  .txt { flex:1; min-width:0; display:flex; flex-direction:column; }
  .nm { font-weight:500; overflow-wrap:anywhere; }
  .note { font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
  .done .nm { color:var(--muted); text-decoration:line-through; font-weight:400; }
  .qty { font-size:14px; color:var(--muted); }
  .check { width:30px; height:30px; border-radius:15px; border:2px solid var(--edge); background:var(--card); display:flex; align-items:center; justify-content:center; }
  .done .check { background:var(--primary); border-color:var(--primary); color:var(--onprimary); }
  .check svg { display:none; } .done .check svg { display:block; }
  .who { width:24px; height:24px; border-radius:12px; background:var(--partner); color:var(--onpartner); font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none; }
  .who.me { background:var(--primary); color:var(--onprimary); }
  .del { flex:none; width:44px; height:44px; border:0; background:none; color:var(--muted); cursor:pointer; border-radius:22px; }
  .del:hover { color:var(--ink); }
  .empty { color:var(--muted); text-align:center; padding:32px 0; }
  .foot { display:flex; justify-content:space-between; margin-top:8px; }
  .link { background:none; border:0; color:var(--muted); font-size:15px; min-height:44px; padding:0 4px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* bottom bar */
  .bottom { position:sticky; bottom:0; background:var(--bg); }
  .bottom .cta { padding:0 20px 12px; }
  .bottom.solid { background:var(--card); border-top:1px solid var(--line); padding:12px 20px calc(24px + env(safe-area-inset-bottom)); }
  nav { height:64px; display:flex; border-top:1px solid var(--line); background:var(--card); padding-bottom:env(safe-area-inset-bottom); box-sizing:content-box; }
  nav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-size:12px; font-weight:500; text-decoration:none; }
  nav a[aria-current=page] { color:var(--primary); font-weight:600; }

  /* inputs */
  label, .lbl { font-size:14px; font-weight:600; }
  input[type=text], input[type=password] { width:100%; height:52px; padding:0 18px; font-size:16px; color:var(--ink); background:var(--card); border:1.5px solid var(--edge); border-radius:26px; }
  input::placeholder { color:var(--muted); opacity:1; }
  input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .field { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  #name { height:56px; font-size:18px; border-radius:28px; }
  .sugg { display:flex; flex-direction:column; background:var(--card); border:1.5px solid var(--line); border-radius:20px; overflow:hidden; }
  .sugg button { display:flex; justify-content:space-between; align-items:center; min-height:48px; padding:0 18px; background:none; border:0; border-bottom:1px solid var(--line); font-size:16px; color:var(--ink); text-align:left; cursor:pointer; }
  .sugg button:last-child { border-bottom:0; }
  .sugg small { font-size:13px; color:var(--muted); }
  .stepper { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .stepper .ctl { display:flex; align-items:center; gap:4px; }
  .stepper button { width:48px; height:48px; border-radius:24px; border:1.5px solid var(--edge); background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; }
  .stepper input { width:84px; height:48px; padding:0 8px; text-align:center; font-size:22px; font-weight:600; border-radius:24px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { height:44px; padding:0 18px; border-radius:22px; border:1.5px solid var(--edge); background:var(--card); font-size:15px; color:var(--ink); cursor:pointer; }
  .chips button[aria-pressed=true] { background:var(--primary); border-color:var(--primary); color:var(--onprimary); font-weight:600; }
  .actions { position:sticky; bottom:0; display:flex; gap:12px; padding:12px 20px 20px; background:var(--card); border-top:1px solid var(--line); }
  .actions .btn:last-child { flex:1; }
  .err { color:#B3261E; min-height:1.2em; font-size:15px; }
  [data-theme="skog"] .err { color:#FFB4A9; }

  /* shopping trip: big pill rows */
  .block .big { font:800 38px 'Bricolage Grotesque','DM Sans',sans-serif; letter-spacing:-1px; line-height:1.1; margin:0; color:var(--onblock); }
  .bar.lg { height:10px; border-radius:5px; } .bar.lg div { border-radius:5px; }
  .with { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; color:var(--onblock-muted); }
  .shop section.aisle { padding-top:18px; } .shop h2 { font-size:15px; margin-bottom:8px; }
  .shop .row-item { border:1.5px solid var(--edge); background:var(--card); border-radius:34px; margin-bottom:8px; padding:0 4px 0 18px; }
  .shop .row-item.done { background:var(--bg); border-color:var(--line); color:var(--muted); }
  .shop .toggle { min-height:68px; font-size:20px; gap:16px; }
  .shop .check { width:34px; height:34px; border-radius:17px; border-width:2.5px; }
  .shop .qty { font-size:17px; font-weight:600; color:inherit; }
  .shop .del, .shop .who { display:none; }

  /* history */
  .hist { display:flex; align-items:center; gap:12px; min-height:62px; border-bottom:1px solid var(--line); }
  .hist .txt span:last-child { font-size:13px; color:var(--muted); }
  .hist .add { width:48px; height:48px; border-radius:24px; border:0; background:var(--primary); color:var(--onprimary); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .onlist { font-size:14px; color:var(--primary); font-weight:600; display:flex; align-items:center; gap:4px; }

  /* appearance */
  .cards { display:flex; flex-direction:column; gap:12px; }
  .pal { display:flex; align-items:center; gap:14px; width:100%; padding:14px 16px; border-radius:22px; text-align:left; cursor:pointer; color:var(--ink); background:var(--card); border:1.5px solid var(--line); }
  .pal[aria-pressed=true] { border:2.5px solid var(--primary); padding:13px 15px; }
  .pal .sw { display:flex; flex:none; }
  .pal .sw i { width:34px; height:34px; border-radius:17px; border:2px solid var(--card); margin-left:-10px; }
  .pal .sw i { box-shadow:inset 0 0 0 1px rgba(127,127,127,.35); }
  .pal .sw i:first-child { margin-left:0; }
  .pal .sw .a { background:var(--block); } .pal .sw .b { background:var(--primary); } .pal .sw .c { background:var(--partner); }
  .pal .t { flex:1; display:flex; flex-direction:column; gap:2px; }
  .pal .t b { font-size:17px; font-weight:600; } .pal .t span { font-size:14px; color:var(--muted); }
  .pal .tick { width:28px; height:28px; border-radius:14px; background:var(--primary); color:var(--onprimary); display:flex; align-items:center; justify-content:center; }
  .preview { margin-top:16px; padding:16px; border-radius:22px; background:var(--card); border:1.5px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  .preview > span { font-size:14px; font-weight:600; color:var(--muted); }
  .preview .p { display:flex; align-items:center; gap:12px; min-height:44px; }
</style>
</head>
<body>
<div id="shell">

  <!-- login -->
  <div class="screen" id="login" hidden>
    <div class="block"><div class="head" style="justify-content:flex-end"><div class="lang" role="group" aria-label="Språk / Language"></div></div>
      <h1 data-i18n="welcome"></h1></div>
    <div class="view" style="padding-top:24px">
      <form id="login-form" style="display:flex;flex-direction:column;gap:12px">
        <input type="text" id="login-name" data-i18n-ph="yourName" autocomplete="given-name" required aria-label="Navn">
        <input type="password" id="login-code" data-i18n-ph="code" required aria-label="Kode">
        <button class="btn wide" data-i18n="join"></button>
        <div class="err" id="login-err" role="alert"></div>
      </form>
    </div>
  </div>

  <!-- list -->
  <div class="screen" id="list" hidden>
    <div class="block">
      <div class="head"><h1 data-i18n="title"></h1><div class="lang" role="group" aria-label="Språk / Language"></div></div>
      <div class="seg" role="group" data-kinds data-i18n-aria="kindsLabel"></div>
      <div class="progress" data-progress><div class="row"><span data-left></span><span data-got></span></div><div class="bar"><div data-pct></div></div></div>
    </div>
    <div class="view">
      <button class="addrow" id="go-add" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="addItem"></span>
      </button>
      <div id="list-items"></div>
      <p class="empty" data-i18n="empty" id="list-empty" hidden></p>
      <div class="foot"><button class="link" id="clear" data-i18n="clear"></button><button class="link" id="logout" data-i18n="logout"></button></div>
    </div>
    <div class="bottom">
      <div class="cta" id="cta"><a class="btn wide" href="#shop" style="height:54px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h15l-1.5 8H7z"/><path d="M5 6L4 3H2"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
        <span data-i18n="start"></span></a></div>
      <nav data-nav></nav>
    </div>
  </div>

  <!-- add -->
  <div class="screen" id="add" hidden>
    <div class="block" style="flex-direction:row;align-items:center;gap:4px;padding:16px 20px 20px 8px">
      <button class="back" type="button" data-back style="margin:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-i18n="addItem" style="font-size:28px;letter-spacing:-.6px"></h1>
    </div>
    <div class="view" style="padding-top:20px">
      <form id="add-form" autocomplete="off">
        <div class="seg" role="group" data-kinds data-i18n-aria="kindsLabel" style="margin-bottom:20px"></div>
        <div class="field">
          <label for="name" data-i18n="whatNeed"></label>
          <input type="text" id="name" maxlength="100" required>
          <div class="sugg" id="sugg" hidden></div>
        </div>
        <div class="stepper"><span class="lbl" id="qtylabel" data-i18n="count"></span>
          <div class="ctl" role="group" aria-labelledby="qtylabel">
            <button type="button" id="less" data-i18n-aria="fewer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <input type="text" id="qty" inputmode="decimal" autocomplete="off" value="1" data-i18n-aria="count">
            <button type="button" id="more" data-i18n-aria="more"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          </div></div>
        <div class="seg units" id="units" role="group" data-i18n-aria="unit"></div>
        <div class="field" id="aisle-field"><span class="lbl" id="catlabel" data-i18n="aisle"></span><div class="chips" id="chips" role="group" aria-labelledby="catlabel"></div></div>
        <div class="field" id="tag-field" hidden><label for="tag" data-i18n="tag"></label>
          <input type="text" id="tag" maxlength="30" data-i18n-ph="tagPh">
          <div class="chips" id="tagchips" role="group" data-i18n-aria="tag"></div></div>
        <div class="field"><label for="note"><span data-i18n="note"></span> <span style="font-weight:400;color:var(--muted)" data-i18n="optional"></span></label>
          <input type="text" id="note" maxlength="200" data-i18n-ph="notePh"></div>
        <div class="err" id="add-err" role="alert"></div>
      </form>
    </div>
    <div class="actions"><button class="btn ghost" type="submit" form="add-form" value="more" data-i18n="addMore"></button><button class="btn" type="submit" form="add-form" value="back" data-i18n="addBtn"></button></div>
  </div>

  <!-- shop -->
  <div class="screen shop" id="shop" hidden>
    <div class="block" style="padding:12px 20px 22px 8px">
      <div class="head"><button class="back" type="button" data-back style="margin:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="with" id="with"></span></div>
      <div style="padding-left:12px;display:flex;flex-direction:column;gap:12px"><p class="big" id="big"></p><div class="bar lg"><div data-pct></div></div></div>
    </div>
    <div class="view" style="padding-top:4px" id="shop-items"></div>
    <div class="bottom solid"><button class="btn wide" id="finish" data-i18n="finish" style="height:58px;font-size:18px"></button></div>
  </div>

  <!-- history -->
  <div class="screen" id="history" hidden>
    <div class="block"><h1 data-i18n="often"></h1><p data-i18n="oftenHint"></p></div>
    <div class="view" style="padding-top:4px">
      <div id="hist-items"></div>
      <p class="empty" data-i18n="oftenEmpty" id="hist-empty" hidden></p>
    </div>
    <div class="bottom"><nav data-nav></nav></div>
  </div>

  <!-- appearance -->
  <div class="screen" id="look" hidden>
    <div class="block"><h1 data-i18n="look"></h1><p data-i18n="lookHint"></p></div>
    <div class="view" style="padding-top:20px">
      <div class="cards" id="pals" role="group" data-i18n-aria="look"></div>
      <div class="preview" aria-hidden="true">
        <span data-i18n="preview"></span>
        <div class="p"><span class="check" style="background:var(--primary);border-color:var(--primary);color:var(--onprimary)"><svg width="16" height="16" viewBox="0 0 24 24" style="display:block" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="nm" style="flex:1;text-decoration:line-through;color:var(--muted);font-weight:400" data-i18n="sample1"></span><span class="who me">J</span></div>
        <div class="p"><span class="check"></span><span class="nm" style="flex:1" data-i18n="sample2"></span><span class="who">K</span></div>
      </div>
    </div>
    <div class="bottom"><nav data-nav></nav></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const CATS = ['produce','dairy','pantry','meat','frozen','household','bakery'];  // aisle order; '' = other, last
const T = {
  nb: { welcome:'Velkommen 🛒', yourName:'Navnet ditt', code:'Husstandskode', join:'Bli med', title:'Vår liste',
        addItem:'Legg til vare', addBtn:'Legg til', addMore:'Legg til og ny', clear:'Fjern avkryssede', logout:'Logg ut', del:'Slett',
        empty:'Listen er tom. Legg til noe over.', start:'Start handletur', navList:'Liste', navOften:'Ofte kjøpt', navLabel:'Hovedmeny',
        whatNeed:'Hva trenger dere?', count:'Antall', fewer:'Færre', more:'Flere', aisle:'Avdeling', note:'Notat', optional:'(valgfritt)',
        notePh:'Størrelse, produsent, alt andre bør vite', back:'Tilbake',
        left:n => `${n} igjen`, got:(g,t) => `${g} av ${t} i kurven`, addedBy:n => `Lagt til av ${n}`,
        bigLeft:n => n === 0 ? 'Alt er handlet' : `${n} igjen å handle`, finish:'Ferdig med handelen', with:n => `${n} handler også`,
        often:'Ofte kjøpt', oftenHint:'Trykk på + for å legge noe tilbake på listen.', oftenEmpty:'Ingenting ennå. Varer du kjøper flere ganger dukker opp her.',
        weekly:'Omtrent hver uke', sometimes:'Av og til', onList:'På listen', addTo:n => `Legg til ${n} på listen`,
        last:r => `sist kjøpt ${r}`, today:'i dag',
        wrongCode:'Feil husstandskode', tooMany:'For mange forsøk, vent ett minutt', error:'Noe gikk galt',
        badQty:'Skriv inn et antall større enn 0', badName:'Sjekk navn, antall og notat (maks 100/20/200 tegn)', dup:'Er allerede på listen', addFail:'Kunne ikke legge til varen', added:n => `La til ${n}`,
        kinds:{ grocery:'Dagligvarer', other:'Annet' }, kindsLabel:'Type liste', unit:'Enhet', units:{ stk:'stk', kg:'kg', L:'L' },

        gotOther:(g,t) => `${g} av ${t} kjøpt`, emptyOther:'Ingenting annet å kjøpe. Legg til gaver, ting til huset og lignende.',

  en: { welcome:'Welcome 🛒', yourName:'Your name', code:'Household code', join:'Join', title:'Our list',

        left:n => `${n} to get`, got:(g,t) => `${g} of ${t} in the basket`, addedBy:n => `Added by ${n}`,
        bigLeft:n => n === 0 ? 'Everything is bought' : `${n} left to buy`, finish:'Done shopping', with:n => `${n} is shopping too`,
        often:'Often bought', oftenHint:'Tap + to put something back on the list.', oftenEmpty:'Nothing yet. Items you buy more than once show up here.',
        weekly:'About every week', sometimes:'Occasionally', onList:'On the list', addTo:n => `Add ${n} to the list`,
        last:r => `last bought ${r}`, today:'today',
        wrongCode:'Wrong household code', tooMany:'Too many attempts, wait a minute', error:'Something went wrong',
        badQty:'Enter an amount greater than 0', badName:'Check name, quantity and note (max 100/20/200 characters)', dup:'Already on the list', addFail:'Could not add item', added:n => `Added ${n}`,
        kinds:{ grocery:'Groceries', other:'Other' }, kindsLabel:'List type', unit:'Unit', units:{ stk:'pcs', kg:'kg', L:'L' },
        tag:'Tag', tagPh:'e.g. Gifts, Clas Ohlson', noTag:'No tag',
        gotOther:(g,t) => `${g} of ${t} bought`, emptyOther:'Nothing else to buy. Add gifts, things for the house and the like.',
        look:'Appearance', lookHint:'Pick colours you both like. The choice applies to both of you.', preview:'Preview', sample1:'Lemons', sample2:'Oat milk',
        pal:{ salvie:['Salvie','Dusty green with soft pink'], mynte:['Mynte','Fresh mint with lavender'], oliven:['Oliven','Olive with butter yellow'], skog:['Skog','Dark, calm evening mode'] },
        cat:{ produce:'Produce', dairy:'Dairy', pantry:'Pantry', meat:'Meat & fish', frozen:'Frozen', household:'Household', bakery:'Bakery', '':'Other' } },
};
let lang = document.documentElement.lang === 'en' ? 'en' : 'nb';
const t = k => T[lang][k];
let me = '', items = [], history = [], others = [], addQty = 1, addCat = '', addUnit = 'stk', addKind = 'grocery', tags = [];
let listKind = localStorage.getItem('sl_kind') === 'other' ? 'other' : 'grocery';

/* ---------- tiny DOM helper (text only, never innerHTML with data) ---------- */
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);

}
const svg = (inner, size = 22, sw = 2) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', sw); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('aria-hidden', 'true'); s.innerHTML = inner; return s; };  // inner is always a constant
const CHECK = () => svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 16, 3);

/* ---------- i18n ---------- */
function setLang(l) {

  document.cookie = 'sl_lang=' + l + '; Path=/; Max-Age=31536000; SameSite=Lax';
  document.title = t('title');
  for (const e of document.querySelectorAll('[data-i18n]')) e.textContent = t(e.dataset.i18n);
  for (const e of document.querySelectorAll('[data-i18n-ph]')) e.placeholder = t(e.dataset.i18nPh);
  for (const e of document.querySelectorAll('[data-i18n-aria]')) e.setAttribute('aria-label', t(e.dataset.i18nAria));
  for (const e of document.querySelectorAll('[data-back]')) e.setAttribute('aria-label', t('back'));
  $('add-form').querySelector('#name').setAttribute('aria-label', t('whatNeed'));
  for (const g of document.querySelectorAll('.lang')) {
    g.replaceChildren(...['nb','en'].map(c => h('button', { type:'button', lang:c, 'aria-pressed': c === l, 'aria-label': c === 'nb' ? 'Norsk' : 'English', onclick: () => setLang(c) }, c === 'nb' ? 'NO' : 'EN')));
  }
  for (const n of document.querySelectorAll('[data-nav]')) n.replaceChildren(
    navLink('#', 'list', t('navList'), '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>'),
    navLink('#history', 'history', t('navOften'), '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
    navLink('#look', 'look', t('look'), '<path d="M12 3a9 9 0 100 18c1.4 0 2-.9 2-1.8 0-1.2-1-1.4-1-2.4 0-.9.7-1.3 1.6-1.3H17a4 4 0 004-4c0-4.4-4-8.5-9-8.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>'));
  for (const n of document.querySelectorAll('[data-nav]')) n.setAttribute('aria-label', t('navLabel'));
  renderKinds(); renderUnits(); renderChips(); renderTags(); renderPals(); route();
}
function navLink(href, view, label, icon) {
  return h('a', { href, 'aria-current': current() === view ? 'page' : null }, svg(icon), label);
}

/* ---------- api ---------- */
async function api(path, method = 'GET', body) {
  try {
    const r = await fetch('/api/' + path, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body && JSON.stringify(body) });
    if (r.status === 401 && path !== 'login' && path !== 'me') { me = ''; route(); }
    return r;
  } catch { return { ok: false, status: 0, json: async () => [] }; }
}

/* ---------- routing ---------- */
const VIEWS = ['login', 'list', 'add', 'shop', 'history', 'look'];
const TABS = { list: 0, history: 1, look: 2 };
function current() {
  if (!me) return 'login';
  const v = location.hash.slice(1);
  return ['add', 'shop', 'history', 'look'].includes(v) ? v : 'list';
}
let prev = null, tripTimer = null;
function route() {
  const v = current();
  for (const id of VIEWS) $(id).hidden = id !== v;
  syncThemeColor();
  if (v !== prev) {
    if (v === 'shop') startTrip(); else if (prev === 'shop') stopTrip();
    if (v === 'add') { addKind = listKind; addQty = 1; addUnit = 'stk'; renderKinds(); renderUnits(); renderQty(); renderChips(); loadTags(); showKindFields(); $('add-err').textContent = ''; setTimeout(() => $('name').focus(), 0); }
    if (v === 'history') loadHistory();
    prev = v; window.scrollTo(0, 0);
  }
  for (const n of document.querySelectorAll('[data-nav] a')) n.removeAttribute('aria-current');
  if (v in TABS) for (const n of document.querySelectorAll('[data-nav]')) n.children[TABS[v]]?.setAttribute('aria-current', 'page');
  render();
}
window.addEventListener('hashchange', route);
const goBack = () => { location.hash = ''; };
for (const b of document.querySelectorAll('[data-back]')) b.onclick = goBack;

/* ---------- rendering ---------- */
const itemsOf = kind => items.filter(i => i.kind === kind);
function sections(list, kind) {
  const coll = new Intl.Collator(lang === 'nb' ? 'nb' : 'en');   // æ ø å sort last in Norwegian
  const sort = v => v.sort((a, b) => (a.done - b.done) || coll.compare(a.name, b.name));
  if (kind === 'other') {   // grouped by free-form tag; untagged last
    const by = new Map();
    for (const it of list) (by.get(it.tag) ?? by.set(it.tag, []).get(it.tag)).push(it);
    return [...by].sort(([a], [b]) => (a === '') - (b === '') || coll.compare(a, b)).map(([k, v]) => [k || t('noTag'), sort(v)]);
  }
  const by = new Map();
  for (const c of [...CATS, '']) by.set(c, []);
  for (const it of list) (by.get(it.category) ?? by.get('')).push(it);
  return [...by].filter(([, v]) => v.length).map(([c, v]) => [t('cat')[c], sort(v)]);
}
// "1.5 kg" is stored with a dot; show a decimal comma in Norwegian
const fmtQty = q => lang === 'nb' ? q.replace(/(\d)\.(\d)/g, '$1,$2') : q;
function itemRow(it, shop) {
  const check = h('span', { class:'check' }, CHECK());
  const who = h('span', { class:'who' + (it.added_by === me ? ' me' : ''), 'aria-label': t('addedBy')(it.added_by), title: t('addedBy')(it.added_by) }, [...it.added_by][0]?.toUpperCase() ?? '');
  const tg = h('button', { class:'toggle', 'aria-pressed': it.done, onclick: async () => { await api('items/' + it.id, 'PATCH', { done: !it.done }); refresh(); } },
    check, h('span', { class:'txt' }, h('span', { class:'nm' }, it.name), it.note ? h('span', { class:'note' }, it.note) : null),
    it.qty ? h('span', { class:'qty' }, fmtQty(it.qty)) : null, who);
  const del = h('button', { class:'del', 'aria-label': t('del') + ' ' + it.name, onclick: async () => { await api('items/' + it.id, 'DELETE'); refresh(); } }, '✕');
  return h('div', { class:'row-item' + (it.done ? ' done' : '') }, tg, del);
}
function progress() {
  const kind = current() === 'shop' ? 'grocery' : listKind, list = itemsOf(kind);
  const got = list.filter(i => i.done).length, n = list.length;
  for (const p of document.querySelectorAll('[data-pct]')) p.style.width = (n ? Math.round(got / n * 100) : 0) + '%';
  for (const e of document.querySelectorAll('[data-left]')) e.textContent = t('left')(n - got);
  for (const e of document.querySelectorAll('[data-got]')) e.textContent = t(kind === 'other' ? 'gotOther' : 'got')(got, n);
  document.querySelector('[data-progress]').hidden = n === 0;
  $('big').textContent = t('bigLeft')(n - got);
}
function render() {
  const v = current();
  progress();
  if (v === 'list' || v === 'shop') {
    const kind = v === 'shop' ? 'grocery' : listKind, list = itemsOf(kind);
    const target = v === 'list' ? $('list-items') : $('shop-items');
    target.replaceChildren(...sections(list, kind).map(([title, its]) =>
      h('section', { class:'aisle' }, h('h2', {}, title), its.map(it => itemRow(it, v === 'shop')))));
    $('list-empty').hidden = list.length > 0;
    $('list-empty').textContent = t(kind === 'other' ? 'emptyOther' : 'empty');
    $('cta').hidden = kind === 'other';
  }
  if (v === 'shop') $('with').textContent = others.length ? t('with')(others.join(', ')) : '';
  if (v === 'history') renderHistory();
}

function ago(ts) {
  const days = Math.floor((Date.now() / 1000 - ts) / 86400), nb = lang === 'nb';
  if (days < 1) return t('today');
  if (days === 1) return nb ? 'i går' : 'yesterday';
  if (days < 14) return nb ? `for ${days} dager siden` : `${days} days ago`;
  const w = Math.floor(days / 7);
  return nb ? `for ${w} uker siden` : `${w} weeks ago`;
}
function renderHistory() {
  $('hist-empty').hidden = history.length > 0;
  const group = f => history.filter(x => x.frequency === f);
  $('hist-items').replaceChildren(...['weekly', 'sometimes'].filter(f => group(f).length).map(f =>
    h('section', { class:'aisle', style:'padding-top:22px' }, h('h2', {}, t(f)), group(f).map(x =>
      h('div', { class:'hist' },
        h('div', { class:'txt' }, h('span', { class:'nm' }, x.name), h('span', {}, `${t('cat')[x.category] ?? t('cat')['']} · ${t('last')(ago(x.last_bought))}`)),
        x.on_list ? h('span', { class:'onlist' }, svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 14, 3), t('onList'))
          : h('button', { class:'add', 'aria-label': t('addTo')(x.name), onclick: async () => {
              await api('items', 'POST', { name: x.name, qty: x.qty, category: x.category }); await Promise.all([refresh(), loadHistory()]); } },
              svg('<path d="M12 5v14M5 12h14"/>', 20, 2.4)))))));
}
async function loadHistory() { const r = await api('history'); if (r.ok) { history = await r.json(); if (current() === 'history') renderHistory(); } }

/* ---------- add screen ---------- */
function renderChips() {
  $('chips').replaceChildren(...CATS.slice(0, 6).concat('bakery').map(c =>
    h('button', { type:'button', 'aria-pressed': addCat === c, onclick: () => { addCat = addCat === c ? '' : c; renderChips(); } }, t('cat')[c])));
}
function renderKinds() {
  for (const box of document.querySelectorAll('[data-kinds]')) {
    const inAdd = $('add').contains(box), cur = inAdd ? addKind : listKind;
    box.replaceChildren(...['grocery', 'other'].map(k => h('button', { type:'button', 'aria-pressed': k === cur, onclick: () => {
      if (inAdd) { addKind = k; showKindFields(); } else { listKind = k; localStorage.setItem('sl_kind', k); }
      renderKinds(); render(); } }, t('kinds')[k])));
  }
}
function showKindFields() {
  $('aisle-field').hidden = addKind !== 'grocery'; $('tag-field').hidden = addKind !== 'other'; $('sugg').hidden = true;
}
const UNIT = { stk:{ step:1, min:1 }, kg:{ step:0.5, min:0.5 }, L:{ step:0.5, min:0.5 } };
function renderUnits() {
  $('units').replaceChildren(...Object.keys(UNIT).map(u => h('button', { type:'button', 'aria-pressed': u === addUnit, onclick: () => {
    addUnit = u; addQty = readQty() ?? addQty; renderUnits(); renderQty(); } }, t('units')[u])));
}
const num = n => lang === 'nb' ? String(n).replace('.', ',') : String(n);
function renderQty() { $('qty').value = num(addQty); }
// Free-form amount ("1,75" or "1.75", "100"): returns null when it isn't a usable number.
function readQty() {
  const n = Number($('qty').value.trim().replace(',', '.'));
  return Number.isFinite(n) && n > 0 && n <= 9999 ? Math.round(n * 1000) / 1000 : null;
}
const qtyString = () => addUnit === 'stk' ? (addQty !== 1 ? String(addQty) : '') : `${addQty} ${addUnit}`;
function stepQty(dir) {
  const n = readQty() ?? addQty, { step, min } = UNIT[addUnit];
  addQty = dir < 0 ? (n > min ? Math.max(min, n - step) : n) : Math.min(9999, n + step);
  addQty = Math.round(addQty * 1000) / 1000; renderQty();
}
$('less').onclick = () => stepQty(-1);
$('more').onclick = () => stepQty(1);
$('qty').oninput = () => { const n = readQty(); if (n != null) addQty = n; };
$('qty').onblur = renderQty;   // snap back to the last valid amount
$('qty').onfocus = () => $('qty').select();
async function loadTags() { const r = await api('tags'); if (r.ok) { tags = await r.json(); renderTags(); } }
function renderTags() {
  const cur = $('tag').value.trim().toLowerCase();
  $('tagchips').replaceChildren(...tags.map(x => h('button', { type:'button', 'aria-pressed': x.toLowerCase() === cur,
    onclick: () => { $('tag').value = $('tag').value.trim() === x ? '' : x; renderTags(); } }, x)));
}
$('tag').oninput = renderTags;
$('go-add').onclick = () => { location.hash = 'add'; };

let suggTimer;
$('name').oninput = () => {
  clearTimeout(suggTimer);
  const q = $('name').value.trim();
  if (!q || addKind !== 'grocery') return void ($('sugg').hidden = true);
  suggTimer = setTimeout(async () => {
    const r = await api('suggest?q=' + encodeURIComponent(q));
    if (!r.ok || $('name').value.trim() !== q) return;
    const s = await r.json();
    $('sugg').hidden = s.length === 0;
    $('sugg').replaceChildren(...s.map(x => h('button', { type:'button', onclick: () => {
      $('name').value = x.name; addCat = x.category; renderChips(); $('sugg').hidden = true; $('note').focus(); } },
      h('span', {}, x.name), h('small', {}, t('cat')[x.category]))));
  }, 150);
};
$('add-form').onsubmit = async e => {
  e.preventDefault();
  const more = e.submitter?.value === 'more';
  const q = readQty();
  if (q == null) { $('add-err').style.color = ''; $('add-err').textContent = t('badQty'); $('qty').focus(); return; }
  addQty = q;
  const name = $('name').value.trim();
  const r = await api('items', 'POST', { name, qty: qtyString(), kind: addKind, category: addKind === 'grocery' ? addCat : '', tag: addKind === 'other' ? $('tag').value : '', note: $('note').value });
  if (!r.ok) { $('add-err').style.color = ''; $('add-err').textContent = r.status === 409 ? t('dup') : r.status === 400 ? t('badName') : t('addFail'); return; }
  $('name').value = $('note').value = ''; $('sugg').hidden = true; addQty = 1; addUnit = 'stk'; addCat = ''; renderChips(); renderUnits(); renderQty(); loadTags();
  listKind = addKind; localStorage.setItem('sl_kind', listKind);
  await refresh();
  if (more) { $('add-err').style.color = 'var(--primary)'; $('add-err').textContent = t('added')(name); $('name').focus(); } else goBack();
};

/* ---------- appearance (palette is shared by the household) ---------- */
const THEMES = ['salvie', 'mynte', 'oliven', 'skog'];
const html = document.documentElement;
function syncThemeColor() {
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(html).getPropertyValue('--block').trim();
}
function applyTheme(id) {
  if (!THEMES.includes(id) || html.dataset.theme === id) return;
  html.dataset.theme = id; syncThemeColor(); renderPals();
}
function renderPals() {
  const cur = html.dataset.theme;
  $('pals').replaceChildren(...THEMES.map(id => h('button', { type:'button', class:'pal', 'aria-pressed': id === cur,
      onclick: async () => { applyTheme(id); const r = await api('settings', 'PUT', { theme: id }); if (!r.ok) loadSettings(); } },
    h('span', { class:'sw', 'data-theme': id, 'aria-hidden': 'true' }, h('i', { class:'a' }), h('i', { class:'b' }), h('i', { class:'c' })),
    h('span', { class:'t' }, h('b', {}, t('pal')[id][0]), h('span', {}, t('pal')[id][1])),
    id === cur ? h('span', { class:'tick', 'aria-hidden':'true' }, CHECK()) : null)));
}
async function loadSettings() { const r = await api('settings'); if (r.ok) applyTheme((await r.json()).theme); }

/* ---------- shopping trip ---------- */
async function ping() { const r = await api('trip', 'POST'); if (r.ok) { others = await r.json(); render(); } }
function startTrip() { ping(); tripTimer = setInterval(ping, 10000); }
function stopTrip() { clearInterval(tripTimer); others = []; api('trip', 'DELETE'); }
$('finish').onclick = async () => { await api('items/clear-done?kind=grocery', 'POST'); await refresh(); goBack(); };

/* ---------- session ---------- */
async function refresh() { loadSettings(); const r = await api('items'); if (r.ok) { items = await r.json(); render(); } }
$('login-form').onsubmit = async e => {
  e.preventDefault();
  const r = await api('login', 'POST', { name: $('login-name').value, code: $('login-code').value });
  if (r.ok) { me = (await r.json()).name; $('login-err').textContent = ''; $('login-code').value = ''; route(); refresh(); }
  else $('login-err').textContent = r.status === 403 ? t('wrongCode') : r.status === 429 ? t('tooMany') : t('error');
};
$('clear').onclick = async () => { await api('items/clear-done?kind=' + listKind, 'POST'); refresh(); };
$('logout').onclick = async () => { stopTrip(); await api('logout', 'POST'); me = ''; items = []; history = []; location.hash = ''; prev = null; route(); };

setLang(lang);
(async () => { const r = await api('me'); if (r.ok) { me = (await r.json()).name; route(); refresh(); } else route(); })();
setInterval(() => { if (me && !document.hidden) { refresh(); if (current() === 'history') loadHistory(); } }, 5000);
</script>
