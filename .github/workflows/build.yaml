# On every push to main: build the image, push it to ghcr.io tagged with the commit, then commit
# that tag into deploy/base/kustomization.yaml. The cluster's Flux sees that commit and deploys it.
# No cluster credentials exist here; the cluster pulls.
name: build-and-publish

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/**"]   # the tag commit below must not trigger another build

permissions:
  contents: write    # commit the new tag
  packages: write    # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        run: kubectl kustomize deploy/base > /dev/null

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/matsrivel/shopping_list:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the deployment at this image
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/" deploy/base/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: image ${GITHUB_SHA::7} [skip ci]"
          git push
