# Needs the Secret `shopping-list` (key `household-code`) in the same namespace. It is NOT in git:
#   kubectl -n shopping create secret generic shopping-list --from-literal=household-code='...'
apiVersion: apps/v1
kind: Deployment
metadata: { name: shopping-list }
spec:
  replicas: 1          # SQLite = single writer; keep at 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: shopping-list } }
  template:
    metadata: { labels: { app: shopping-list } }
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }   # required by the cluster's "restricted" Pod Security
      containers:
        - name: app
          image: shopping-list   # replaced by kustomization.yaml `images:`
          ports: [{ containerPort: 8080 }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            # Set to "1" when served over HTTPS (adds the Secure cookie flag)
            - { name: COOKIE_SECURE, value: "1" }
            - name: HOUSEHOLD_CODE
              valueFrom: { secretKeyRef: { name: shopping-list, key: household-code } }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: shopping-list-data }
